<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('AI4CEO Web')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="hero">
    <p class="eyebrow">Spring Boot + login</p>
    <h1>A simple member site</h1>
    <p class="lede">Browse the public pages, create an account, then log in to open your protected page.</p>
    <div class="actions">
        <a class="btn" th:href="@{/signup}">Sign up</a>
        <a class="btn btn-ghost" th:href="@{/login}">Log in</a>
    </div>
    <p class="hint" th:if="${param.logout}">You have been logged out.</p>
</main>
</body>
</html>
