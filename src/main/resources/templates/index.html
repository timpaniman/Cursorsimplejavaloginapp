<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('AI4CEO Web')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="hero">
    <p class="eyebrow">Spring Boot + 로그인</p>
    <h1>간단한 회원 웹사이트</h1>
    <p class="lede">공개 페이지를 보고, 가입한 뒤 로그인하면 보호된 내 페이지로 들어갑니다.</p>
    <div class="actions">
        <a class="btn" th:href="@{/signup}">회원가입</a>
        <a class="btn btn-ghost" th:href="@{/login}">로그인</a>
    </div>
    <p class="hint" th:if="${param.logout}">로그아웃되었습니다.</p>
</main>
</body>
</html>
