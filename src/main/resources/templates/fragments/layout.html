<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">AI4CEO</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:fragment="nav" class="nav">
    <a class="brand" th:href="@{/}">AI4CEO Web</a>
    <nav>
        <a th:href="@{/}">홈</a>
        <a th:href="@{/about}">소개</a>
        <a th:href="@{/app}" sec:authorize="isAuthenticated()">내 페이지</a>
        <a th:href="@{/login}" sec:authorize="!isAuthenticated()">로그인</a>
        <a class="btn btn-small" th:href="@{/signup}" sec:authorize="!isAuthenticated()">회원가입</a>
        <form th:action="@{/logout}" method="post" class="inline" sec:authorize="isAuthenticated()">
            <button type="submit" class="btn btn-small btn-ghost">로그아웃</button>
        </form>
    </nav>
</header>
</body>
</html>
