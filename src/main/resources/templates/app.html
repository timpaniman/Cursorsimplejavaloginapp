<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My page · AI4CEO Web')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="page">
    <p class="eyebrow">Protected page</p>
    <h1>Hello, <span th:text="${user.displayName}">User</span></h1>
    <p class="lede">You are logged in. Only members can see this page.</p>
    <section class="profile">
        <h2>My account</h2>
        <p><strong>Name</strong> <span th:text="${user.displayName}"></span></p>
        <p><strong>Email</strong> <span th:text="${user.email}"></span></p>
    </section>
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-ghost">Log out</button>
    </form>
</main>
</body>
</html>
