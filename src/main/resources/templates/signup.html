<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign up · AI4CEO Web')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="page narrow">
    <h1>Sign up</h1>
    <form th:action="@{/signup}" th:object="${signupForm}" method="post" class="card-form">
        <label>
            Name
            <input type="text" th:field="*{displayName}" required>
            <span class="error" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}"></span>
        </label>
        <label>
            Email
            <input type="email" th:field="*{email}" required>
            <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </label>
        <label>
            Password (at least 6 characters)
            <input type="password" th:field="*{password}" required minlength="6">
            <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </label>
        <button type="submit" class="btn">Create account</button>
    </form>
    <p class="hint">Demo account: demo@demo.com / Demo123</p>
    <p>Already have an account? <a th:href="@{/login}">Log in</a></p>
</main>
</body>
</html>
