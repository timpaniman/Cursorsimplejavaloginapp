<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('회원가입 · AI4CEO Web')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="page narrow">
    <h1>회원가입</h1>
    <form th:action="@{/signup}" th:object="${signupForm}" method="post" class="card-form">
        <label>
            이름
            <input type="text" th:field="*{displayName}" required>
            <span class="error" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}"></span>
        </label>
        <label>
            이메일
            <input type="email" th:field="*{email}" required>
            <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </label>
        <label>
            비밀번호 (6자 이상)
            <input type="password" th:field="*{password}" required minlength="6">
            <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </label>
        <button type="submit" class="btn">가입하기</button>
    </form>
    <p>이미 계정이 있나요? <a th:href="@{/login}">로그인</a></p>
</main>
</body>
</html>
