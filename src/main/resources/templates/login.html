<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log in · AI4CEO Web')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="page narrow">
    <h1>Log in</h1>
    <p class="ok" th:if="${signupSuccess}">Your account is ready. Please log in.</p>
    <p class="error" th:if="${param.error}">Email or password is incorrect.</p>
    <form th:action="@{/login}" method="post" class="card-form">
        <label>
            Email
            <input type="email" name="username" required autofocus>
        </label>
        <label>
            Password
            <input type="password" name="password" required>
        </label>
        <button type="submit" class="btn">Log in</button>
    </form>
    <p class="hint">Demo account: demo@demo.com / Demo123</p>
    <p>Need an account? <a th:href="@{/signup}">Sign up</a></p>
</main>
</body>
</html>
